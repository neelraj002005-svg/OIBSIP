<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThermoShift - Celsius, Fahrenheit and Kelvin converter</title>
<meta name="description" content="ThermoShift converts temperature between Celsius, Fahrenheit and Kelvin with input validation and a live thermometer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23111'/><rect x='42' y='16' width='16' height='48' rx='8' fill='white'/><circle cx='50' cy='70' r='15' fill='%23ff5a36'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
<div class="grain" aria-hidden="true"></div>

<main class="app">
  <header class="top">
    <span class="brand"><i></i>ThermoShift</span>
    <span class="status" id="mood">Room temperature</span>
  </header>

  <div class="layout">
    <section class="gauge" aria-hidden="true">
      <div class="therm">
        <div class="tube"><div class="mercury" id="mercury"></div>
          <span class="tick" style="--p:0%"></span><span class="tick" style="--p:25%"></span><span class="tick" style="--p:50%"></span><span class="tick" style="--p:75%"></span><span class="tick" style="--p:100%"></span>
        </div>
        <div class="bulb" id="bulb"></div>
      </div>
      <div class="big"><span id="bigVal">25</span><small id="bigUnit">&deg;C</small></div>
    </section>

    <section class="panel">
      <h1>Convert any<br>temperature.</h1>
      <p class="sub">Type a value, choose its unit, then press Convert.</p>

      <form id="form" novalidate>
        <label class="lbl" for="value">Temperature</label>
        <div class="field">
          <input id="value" name="temperature" type="text" inputmode="decimal" placeholder="e.g. 36.6" autocomplete="off" aria-describedby="error">
          <span class="u" id="uTag">&deg;C</span>
        </div>

        <fieldset class="seg" aria-label="Input unit">
          <legend class="lbl">From unit</legend>
          <input type="radio" name="unit" id="uC" value="C" checked><label for="uC">Celsius</label>
          <input type="radio" name="unit" id="uF" value="F"><label for="uF">Fahrenheit</label>
          <input type="radio" name="unit" id="uK" value="K"><label for="uK">Kelvin</label>
          <span class="thumb" aria-hidden="true"></span>
        </fieldset>

        <p id="error" class="error" role="alert"></p>
        <button class="convert" type="submit"><span>Convert</span><i>&rarr;</i></button>
      </form>

      <div class="presets" aria-label="Quick values">
        <button type="button" data-v="0" data-u="C">Freezing</button>
        <button type="button" data-v="25" data-u="C">Room</button>
        <button type="button" data-v="37" data-u="C">Body</button>
        <button type="button" data-v="100" data-u="C">Boiling</button>
      </div>

      <div id="results" class="results" aria-live="polite" hidden>
        <div class="res" id="boxC"><span>Celsius</span><strong id="rC">-</strong></div>
        <div class="res" id="boxF"><span>Fahrenheit</span><strong id="rF">-</strong></div>
        <div class="res" id="boxK"><span>Kelvin</span><strong id="rK">-</strong></div>
      </div>
    </section>
  </div>
  <footer class="foot">Built with HTML, CSS and vanilla JavaScript. Absolute zero is -273.15&deg;C.</footer>
</main>
<script src="script.js"></script>
</body>
</html>
